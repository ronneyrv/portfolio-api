name: CD

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  ORACLE_HOST: 204.216.151.159
  ORACLE_USER: ubuntu
  CONTAINER_NAME: portfolio-api
  CONTAINER_PORT: 8081
  IMAGE_TAG: sha-${{ github.sha }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "${{ secrets.ORACLE_SSH_PRIVATE_KEY }}" > ~/.ssh/oracle_deploy_key
          chmod 600 ~/.ssh/oracle_deploy_key

          printf '%s\n' \
            '204.216.151.159 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIGAT6mD4WDr6JcK5ejrxvO9PUJix9M6T36+4ZGnJsqQP' \
            > ~/.ssh/known_hosts

      - name: Deploy to Oracle
        run: |
          ssh \
            -i ~/.ssh/oracle_deploy_key \
            -o StrictHostKeyChecking=yes \
            -o IdentitiesOnly=yes \
            -o ConnectTimeout=10 \
            ${{ env.ORACLE_USER }}@${{ env.ORACLE_HOST }} \
            bash -s -- "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}" <<'REMOTE'
          set -euo pipefail

          IMAGE="$1"
          CONTAINER="portfolio-api"

          rollback() {
            if [ -z "${PREVIOUS_IMAGE:-}" ]; then
              echo "No previous image available for rollback."
              return 1
            fi

            echo "Rolling back to: $PREVIOUS_IMAGE"

            sudo docker rm -f "$CONTAINER" 2>/dev/null || true

            sudo docker run -d \
              --name "$CONTAINER" \
              --restart unless-stopped \
              --env-file /opt/portfolio-api/.env \
              -e JAVA_TOOL_OPTIONS='-Xms64m -Xmx192m' \
              -p 127.0.0.1:8081:8080 \
              "$PREVIOUS_IMAGE"

            for i in $(seq 1 30); do
              if curl -fsS --max-time 5 \
                http://127.0.0.1:8081/actuator/health > /dev/null; then
                echo "Rollback successful."
                return 0
              fi

              echo "Waiting for rollback to become healthy... attempt $i/30"
              sleep 5
            done

            echo "Rollback failed."
            return 1
          }

          if sudo docker inspect "$CONTAINER" >/dev/null 2>&1; then
            PREVIOUS_IMAGE="$(sudo docker inspect --format '{{.Config.Image}}' "$CONTAINER")"
            echo "Previous image: $PREVIOUS_IMAGE"
          else
            PREVIOUS_IMAGE=""
            echo "No existing Portfolio API container found."
          fi

          echo "Pulling new image: $IMAGE"
          sudo docker pull "$IMAGE"

          if sudo docker inspect "$CONTAINER" >/dev/null 2>&1; then
            sudo docker stop "$CONTAINER"
            sudo docker rm "$CONTAINER"
          fi

          echo "Starting new Portfolio API container."

          if ! sudo docker run -d \
            --name "$CONTAINER" \
            --restart unless-stopped \
            --env-file /opt/portfolio-api/.env \
            -e JAVA_TOOL_OPTIONS='-Xms64m -Xmx192m' \
            -p 127.0.0.1:8081:8080 \
            "$IMAGE"; then

            echo "Failed to start the new container."
            rollback || true
            exit 1
          fi

          for i in $(seq 1 48); do
            if curl -fsS --max-time 5 \
              http://127.0.0.1:8081/actuator/health > /dev/null; then
              echo "Portfolio API is healthy."
              exit 0
            fi

            echo "Waiting for Portfolio API to become healthy... attempt $i/48"
            sleep 5
          done

          echo "New Portfolio API version failed health check."
          sudo docker logs --tail 100 "$CONTAINER" || true

          if rollback; then
            echo "Previous Portfolio API version restored."
          else
            echo "WARNING: Previous Portfolio API version could not be restored."
          fi

          exit 1
          REMOTE

      - name: Clean up SSH key
        if: always()
        run: rm -f ~/.ssh/oracle_deploy_key
